name: lookout
services:
  app:
    image: lookout:local
    command: ["-config", "/run/lookout/lookout.toml"]
    cpus: 1
    mem_limit: 128m
    memswap_limit: 128m
    ports: ["${LISTEN_ADDR:-127.0.0.1}:${PORT:-8083}:8080"]
    volumes:
      - type: bind
        source: ./lookout-config
        target: /run/lookout
        read_only: true
        bind:
          create_host_path: false
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    healthcheck:
      test: [CMD, /app/lookout, -healthcheck]
      interval: 15s
      timeout: 4s
      retries: 3
      start_period: 20s
    networks: [database]
networks:
  database:
    external: true
    name: ${POSTGRES_NETWORK:-postgres_net}
