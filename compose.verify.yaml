services:
  db:
    image: postgres:18.7-alpine
    cpus: 1
    mem_limit: 256m
    memswap_limit: 256m
    environment:
      POSTGRES_USER: lookout_test
      POSTGRES_PASSWORD: disposable-test-only
      POSTGRES_DB: lookout_test
    tmpfs: [/var/lib/postgresql]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U lookout_test]
      interval: 1s
      timeout: 2s
      retries: 30
  app:
    image: lookout:local
    networks:
      default:
        aliases: [lookout.test]
    cpus: 1
    mem_limit: 128m
    memswap_limit: 128m
    environment:
      DATABASE_URL: postgres://lookout_test:disposable-test-only@db/lookout_test?sslmode=disable
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    depends_on:
      db: {condition: service_healthy}
    healthcheck:
      test: [CMD, /app/lookout, -healthcheck]
      interval: 1s
      timeout: 3s
      retries: 30
  browser:
    image: mcr.microsoft.com/playwright:v1.65.1-noble
    cpus: 2
    mem_limit: 2g
    memswap_limit: 2g
    working_dir: /app/web
    volumes: [".:/app", "lookout-tools_node-mod:/app/web/node_modules"]
    environment:
      BASE_URL: http://lookout.test:8080
    command: [npm, run, test:e2e]
volumes:
  lookout-tools_node-mod: {external: true}
